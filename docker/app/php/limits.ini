; Story S1.11 Step 9 (production upgrade, 2026-11-17): the Elgg 4 → 5
; "Move Files" async upgrade (moves files uploaded using the file plugin
; to the file entity folder instead of the owner entity folder; 3403
; items) processes uploaded images through Imagine's Gd driver and
; fatals on the base image's defaults — single ~46.5 MB allocations
; (~11 MP decoded bitmaps) exhaust the 128M memory_limit, and batches
; outlive the 30s max_execution_time ("Allowed memory size of 134217728
; bytes exhausted" / "Maximum execution time of 30 seconds exceeded",
; vendor/imagine/imagine/src/Gd/Image.php). Every batch fatal kills its
; AJAX request, so the upgrade counter never advances (stuck 0/3403).
;
; Permanent production headroom, not upgrade-window-only: the S1.13
; fresh-restore hop re-runs this same migration chain against 2.3-era
; image data. 120s = batches complete well inside it while still
; bounding a wedged request (0 timeout fatals observed). The Composer
; CLI wrapper (docker/app/Dockerfile) pins max_execution_time back to 0
; for composer runs only — dependency updates legitimately run longer.
;
; memory_limit history: 512M unblocked the ~46.5 MB allocations, then
; the Move Files run hit a ~50–64 MP image (192,000,001-byte single
; allocation, an ~8000×8000 truecolor bitmap) whose icon-size sequence
; holds the master bitmap while loading the next size — two ~192 MB
; buffers plus GD overhead exceed 512M ("Allowed memory size of
; 536870912 bytes exhausted", Gd/Image.php:778, 2026-11-18). 1024M
; covers the two-buffer peak with headroom; the limit is a cap, not a
; reservation — normal requests never allocate it.
memory_limit = 1024M
max_execution_time = 120
