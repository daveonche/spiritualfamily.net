; Intentionally empty - do not add extension= or zend_extension= lines here.
;
; The base image's docker-php-ext-*.ini files already load exif, gd, intl,
; mysqli, opcache, pdo_mysql, sodium and zip. PHP scans conf.d alphabetically,
; so lines in this file were the second load of each module and emitted
; "Module 'X' already loaded" warnings on every PHP start (observed in
; production 2026-11-01). The file is kept (rather than deleted from the
; repo) so the docker/app/php/ COPY keeps overwriting any extensions.ini the
; base image ships at the same conf.d path.
