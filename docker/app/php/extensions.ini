; This file overwrites the base image's extensions.ini at the same conf.d
; path (docker/app/Dockerfile: COPY docker/app/php/). The base image's copy
; carried extension= lines for every module it compiles — including
; pdo_mysql — so an intentionally empty repo copy silently disabled them
; (observed 2026-11-03: Elgg 3.3.25 reports "couldn't connect to the
; database" on valid credentials; pdo_mysql.so present in extension_dir
; but extension_loaded() false, no ini reference). The duplicate-load
; warnings this file was emptied to avoid (2026-11-01) came from the
; pre-S1.9 repo copy duplicating the base image's own loads; keep here
; only lines the runtime genuinely needs and that no other conf.d ini
; provides.
;
; Elgg 3 (Story S1.9 Step 5) talks to MySQL exclusively through PDO
; ("ext-pdo": "*" in elgg/elgg's composer.json) — the Elgg 2.3 baseline
; used mysqli, which is why pdo_mysql was never missed before the upgrade:
extension=pdo_mysql
;
; Elgg 3 (Story S1.9 Step 5) renders entity icons (avatars, cover photos)
; through Imagine's Gd driver — the upgrade fataled with
; "Imagine\Exception\RuntimeException: Gd not installed" while gd.so sat
; unloaded in extension_dir (observed 2026-11-03):
extension=gd
