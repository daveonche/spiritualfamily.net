services:
  app:
    # The app server — locally built: upstream PHP 7.4 webserver + Composer 2
    # (docker/app/Dockerfile) so composer.json/composer.lock work runs in the
    # orchestration.
    # Build context is the repository root (Story S1.6): the production
    # definition carries no repo bind mounts — Coolify v4.4.6 runs `up`
    # without the cloned repository present, so repo-relative bind
    # sources resolve to empty directories; the images carry their
    # runtime content, baked at build from the committed repo
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      # PHP runtime version (Story S1.2; default recorded in
      # docs/baseline/baseline.md) — flows into docker/app/Dockerfile;
      # override via environment (shell export or .env) to build any
      # runtime version from these unedited files
      args:
        PHP_VERSION: "${PHP_VERSION:-7.4}"
    # Tag for the locally built image (Compose allows build + image together);
    # adjust the name to taste; the runtime version is interpolated so each
    # PHP version builds under its own tag
    image: "sfn/elgg_webserver:${PHP_VERSION:-7.4}-composer2"
    container_name: ${APP_CONTAINER_NAME}
    env_file:
      # This passes variables from .env to the container
      - .env                                                  
    environment:
      # Outgoing-mail relay for PHP mail() → msmtp (docker/app/php/mail.ini): defaults
      # target the Docker Desktop MailHog extension (SMTP 1025); production
      # overrides via Coolify env (Story S1.6)
      MAIL_SMTP_HOST: "${MAIL_SMTP_HOST:-host.docker.internal}"
      MAIL_SMTP_PORT: "${MAIL_SMTP_PORT:-1025}"
    # Only the three persistent data volumes (Story S1.6): the web root,
    # PHP ini overrides, and every repo file the old dev/test mounts
    # provided are baked into the image at build; the repo-relative bind
    # mounts live on in compose.dev.yml for local development
    volumes:
      # Persist dataroot — .env's WWW_DATA (read via getenv in
      # settings.php) must stay identical to this path
      - fs-dataroot:/var/www/dataroot
      # Persist cacheroot — .env's WWW_CACHE must match
      - fs-cacheroot:/var/www/cacheroot
      # Persist assetroot
      - fs-assetroot:/var/www/assetroot
    extra_hosts:
      # Map custom host to host-gateway 
      - "${APP_HOST}:host-gateway"
    ports:
      # Map host port to container port
      - "${APP_HOST_PORT}:80"
    depends_on:
      dbm:
        # Start the app only once MySQL is really ready
        condition: service_healthy
        # When Compose updates/restarts dbm, restart the app too so stale
        # DB connections (e.g. after a Docker Desktop restart) are cleared
        # (requires Compose v2.22+; drop this line on older versions)
        restart: true
    restart: unless-stopped
    # Story S1.8 Step 6: automatic stdout rotation — the default json-file
    # driver pinned explicitly with size/count rotation: the daemon rotates
    # each service's stdout log at 5 MB and keeps at most 5 segments
    # (oldest removed) with no operator intervention. Values quoted —
    # unquoted numbers/booleans are misparsed by YAML (docker conventions).
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "5"
    networks:
      - appnet

  dbm:
    # Pinned to production parity (Story S1.2 Step 5): production reports
    # 10.11.18-MariaDB-log via phpMyAdmin server info — the -log suffix is
    # a build variant, not part of the Docker tag. Bump the tag
    # deliberately alongside the upgrade journey, never float
    image: mariadb:10.11.18
    container_name: ${MYSQL_CONTAINER_NAME}
    env_file:
      # This passes variables from .env to the container
      - .env
    environment:
      # The mariadb client honors MYSQL_HOST as its default connection host.
      # .env sets it for the app's dbhost; leaked into dbm via env_file it
      # points the healthcheck probe at this container's own IP, where the
      # entrypoint-created healthcheck account (localhost/127.0.0.1/::1 only)
      # never matches — so every probe login was denied. Pinning it to
      # localhost keeps the probe on the unix socket, where the account
      # exists. (environment beats env_file.)
      MYSQL_HOST: localhost
    volumes:
      # Persist database data
      - fs-dbmdata:/var/lib/mysql
    healthcheck:
      # healthcheck.sh (shipped with the MariaDB image) exits 0 only once
      # the server accepts connections AND InnoDB initialization/recovery
      # has completed — the same readiness semantics mysqladmin ping gave
      # on the mysql:9 image, via the image's supported mechanism.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 1m
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # Story S1.8 Step 6: automatic stdout rotation (same policy as app)
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "5"
    networks:
      - appnet

  cron:
    # Locally built (Story S1.6): the committed crontab is baked into the
    # image (docker/cron/Dockerfile) — the production definition carries
    # no repo bind mounts. Tag carries the pinned alpine base version
    # (Story S1.2 Step 3 pin); bump deliberately, never float
    build:
      context: .
      dockerfile: docker/cron/Dockerfile
    image: "sfn/elgg_cron:3.23.3"
    container_name: ${CRON_CONTAINER_NAME}
    environment:
      - HOST=${APP_HOST}
      # Story S1.8 Step 6: the application log path the rotation script
      # targets — the same variable the app's settings.php reads (Step 1);
      # the default mirrors the script's baked fallback on fs-dataroot
      # (.env.example's empty default = SAPI log destination, not a file)
      - ELGG_LOG_FILE=${ELGG_LOG_FILE:-/var/www/dataroot/elgg-log.txt}
      - MINUTE_TOKEN=${APP_CRON_MINUTE}
      - FIVEMINUTE_TOKEN=${APP_CRON_FIVEMINUTE}
      - FIFTEENMIN_TOKEN=${APP_CRON_FIFTEENMIN}
      - HALFHOUR_TOKEN=${APP_CRON_HALFHOUR}
      - HOURLY_TOKEN=${APP_CRON_HOURLY}
      - DAILY_TOKEN=${APP_CRON_DAILY}
      - WEEKLY_TOKEN=${APP_CRON_WEEKLY}
      - MONTHLY_TOKEN=${APP_CRON_MONTHLY}
      - YEARLY_TOKEN=${APP_CRON_YEARLY}
    # 1. Replace tokens and write to the active BusyBox spool location
    # 2. Set strict permissions (required by BusyBox cron)
    # 3. Create 'cron.update' to force the daemon to reload the new file immediately
    # 4. Start crond in foreground with log level 8 (debug) on stderr, so
    #    scheduled execution is observable via `docker compose logs cron`
    entrypoint:
      - sh
      - -c
      - |
        sed -e "s|{{HOST_PLACEHOLDER}}|$$HOST|g"\
          -e "s|{{MINUTE_PLACEHOLDER}}|$$MINUTE_TOKEN|g"\
          -e "s|{{FIVEMINUTE_PLACEHOLDER}}|$$FIVEMINUTE_TOKEN|g"\
          -e "s|{{FIFTEENMIN_PLACEHOLDER}}|$$FIFTEENMIN_TOKEN|g"\
          -e "s|{{HALFHOUR_PLACEHOLDER}}|$$HALFHOUR_TOKEN|g"\
          -e "s|{{HOURLY_PLACEHOLDER}}|$$HOURLY_TOKEN|g"\
          -e "s|{{DAILY_PLACEHOLDER}}|$$DAILY_TOKEN|g"\
          -e "s|{{WEEKLY_PLACEHOLDER}}|$$WEEKLY_TOKEN|g"\
          -e "s|{{MONTHLY_PLACEHOLDER}}|$$MONTHLY_TOKEN|g"\
          -e "s|{{YEARLY_PLACEHOLDER}}|$$YEARLY_TOKEN|g"\
          /tmp/app-cron | tr -d '\r' > /var/spool/cron/crontabs/root
        chmod 600 /var/spool/cron/crontabs/root
        touch /var/spool/cron/crontabs/cron.update
        crond -f -d 8
    volumes:
      # Persist the scheduled-task output log and its rotated archives
      # (Story S1.7 Step 5): the retention window spans container
      # recreation
      - fs-cronlog:/var/log/cron
      # Story S1.8 Step 6: read-write access to the Elgg data directory
      # so the cron container can rotate the application log file
      # (ELGG_LOG_FILE, Step 1) written by the app on this same volume
      - fs-dataroot:/var/www/dataroot
    # Story S1.8 Step 6: automatic stdout rotation (same policy as app/dbm)
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "5"
    networks:
      - appnet
    depends_on:
      - app
    restart: unless-stopped

networks:
  appnet:
    driver: bridge
volumes:
  fs-dataroot:
  fs-cacheroot:
  fs-assetroot:
  fs-dbmdata:
  fs-cronlog:
