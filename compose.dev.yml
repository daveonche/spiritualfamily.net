services:
  mailhog:
    image: mailhog/mailhog
    container_name: ${MAILHOG_CONTAINER_NAME}
    # This passes variables from .env to the container
    env_file:
      - .env                                            
    ports:
      - "${MAILHOG_HOST_PORT}:8025"
      - "${MAILHOG_SMTP_PORT}:1025"
    # volumes:
    #   - fs-mailhogdata:${DATA_ROOT}/mailhogdata/
    # command: sh -c "chmod -R 777 /var/www/mailhogdata && chown -R www-data:www-data /var/www/mailhogdata && /usr/local/bin/start_app.sh" 
    restart: unless-stopped
    networks:
      - appnet

