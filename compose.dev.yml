# Dev-only Compose overrides (Story S1.2).
#
# Use it for development-only services and settings that must never reach
# production: merge it with
#   docker compose -f compose.yml -f compose.dev.yml up -d
# Keep any image tags pinned to exact versions and record the pins in
# docs/baseline/baseline.md.
#
# Services defined here are invisible to deployments that parse only
# compose.yml (e.g., Coolify — see docs/deployment/coolify.md).

services:
  # Dev-only repo bind mounts (Story S1.6): the production definition
  # carries no bind mounts — the images bake their runtime content — so
  # local development re-adds them here: live-editable web root and PHP
  # ini, plus the read-only repo files the in-container test suite
  # verifies (docs, docker/, compose files, crontab, .env.example,
  # .gitignore, CI workflow). Always run merged with compose.yml; Compose
  # merges volumes by mount target, so these add to the named data
  # volumes rather than replacing them.
  app:
    volumes:
      - ./docker/app/php/:/usr/local/etc/php/conf.d/
      - ./src:/var/www/html
      - ./docs:/var/www/docs:ro
      - ./docker:/var/www/docker:ro
      - ./compose.yml:/var/www/compose.yml:ro
      - ./compose.dev.yml:/var/www/compose.dev.yml:ro
      - ./docker/cron/crontab:/var/www/crontab:ro
      - ./.env.example:/var/www/.env.example:ro
      - ./.gitignore:/var/www/.gitignore:ro
      - ./.github/workflows/ci.yml:/var/www/.github/workflows/ci.yml:ro
  cron:
    volumes:
      - ./docker/cron/crontab:/tmp/app-cron:ro
  pma:
    # Development-only database administration UI. Moved here from
    # compose.yml (Story S1.6) so production deployments that parse only
    # compose.yml never see it. Always run merged with compose.yml — dbm
    # and the appnet network are defined there.
    # Pinned (Story S1.2 Step 6): the floating phpmyadmin/phpmyadmin tag
    # resolved to 5.2.3 at pin time — confirmed via the image's own
    # /var/www/html/package.json ("version": "5.2.3"). Bump the tag
    # deliberately, never float
    image: phpmyadmin/phpmyadmin:5.2.3
    container_name: ${PMA_CONTAINER_NAME}
    ports:
      - "${PMA_HOST_PORT}:80"
    env_file:
      # This passes variables from .env to the container
      - .env
    depends_on:
      dbm:
        # Start phpMyAdmin only once MySQL is really ready
        condition: service_healthy
    restart: unless-stopped
    networks:
      - appnet
