# CI pipeline.
#
# Jobs:
# - commit-msg: enforce the commit-msg hook on every pushed/PR commit so
#   client-side bypasses (--no-verify, unwired hooks) cannot land
#   non-conforming subjects. The hook script .githooks/commit-msg is the
#   single source of truth.
# - runtime: verify the pipeline executes on the single pinned runtime
#   version recorded in docs/baseline/baseline.md (PHP 7.4.27).
# - composer-validate: validate the dependency manifest's structure and
#   declared metadata with `composer validate --strict`, independent of
#   installation (nothing is downloaded). Manifest ↔ lock consistency is
#   a separate dedicated check.
# - composer-install: install dependencies from the committed lock file
#   on the pinned runtime — exactly the locked versions, no
#   re-resolution; a missing or unusable lock file fails the job.
# - php-lint: scan the project's own source (src/, excluding
#   src/vendor/) for PHP syntax errors with `php -l` on the pinned
#   runtime; any syntax error fails the pipeline and names the file.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only baseline: this workflow never writes to the repository.
permissions:
  contents: read

jobs:
  commit-msg:
    name: Enforce commit-msg hook
    runs-on: ubuntu-latest
    steps:
      # Full history is genuinely required: the push range and the
      # new-branch fallback (--not --remotes) resolve commits a depth-1
      # checkout would not fetch.
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Validate commit subjects with .githooks/commit-msg
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.base_ref || github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            # PR: validate every commit the pull request introduces
            # (the merge commit itself is hook-exempt: "Merge ...")
            git log --format=%s "origin/$BASE_REF..$HEAD_SHA" > /tmp/subjects.txt
          elif [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            # New branch or rewritten history: BEFORE_SHA is all-zero or no
            # longer resolves — validate every commit not on any remote ref
            git log --format=%s "$HEAD_SHA" --not --remotes > /tmp/subjects.txt
          else
            # Push to an existing branch: validate exactly the pushed range
            git log --format=%s "$BEFORE_SHA..$HEAD_SHA" > /tmp/subjects.txt
          fi

          status=0
          while IFS= read -r subject; do
            printf '%s\n' "$subject" > /tmp/commit-msg.txt
            if ! bash .githooks/commit-msg /tmp/commit-msg.txt; then
              echo "::error::commit subject rejected by .githooks/commit-msg: $subject"
              status=1
            fi
          done < /tmp/subjects.txt
          exit "$status"

  runtime:
    name: Pinned runtime verification (PHP 7.4.27)
    runs-on: ubuntu-latest
    container:
      # Single pinned runtime version from docs/baseline/baseline.md
      # (Pinned Versions: PHP runtime 7.4.27). The project's own app image
      # is built locally and not registry-published, so CI uses the official
      # php image tagged at the exact pinned version; the version assertion
      # below guards against tag drift.
      image: php:7.4.27-cli
    steps:
      - name: Verify runtime matches the pinned baseline version
        run: |
          set -euo pipefail
          php -v
          actual="$(php -r 'echo PHP_VERSION;')"
          expected="7.4.27"
          if [ "$actual" != "$expected" ]; then
            echo "::error::PHP runtime $actual does not match the pinned baseline version $expected (docs/baseline/baseline.md)"
            exit 1
          fi
          echo "Pinned runtime confirmed: PHP $expected"

  composer-validate:
    name: Validate dependency manifest (composer.json)
    runs-on: ubuntu-latest
    # Read-only job: explicit job-level override keeps the effective
    # scope visible on top of the workflow-level baseline.
    permissions:
      contents: read
    container:
      # Composer 2.2 LTS line — the composer line compatible with the
      # PHP 7.4 baseline era — at an exact tag. Validation is local
      # only: no dependency download, no install step.
      image: composer:2.2.24
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate composer.json structure and declared metadata
        # The manifest lives in src/ (src/composer.json), not at the
        # checkout root.
        working-directory: src
        run: |
          set -euo pipefail
          composer --version
          # --strict: any warning fails the job, so a failed validation
          # marks the whole pipeline failed.
          # Lock-related and publish/version checks are out of scope here:
          # manifest ↔ lock consistency is a separate dedicated check, and
          # this repository is a project, not a published package.
          composer validate --strict --no-check-all --no-check-lock --no-check-publish --no-check-version
          echo "Dependency manifest validation passed."

  composer-install:
    name: Install dependencies from committed lock file
    runs-on: ubuntu-latest
    # Read-only job: explicit job-level override keeps the effective
    # scope visible on top of the workflow-level baseline.
    permissions:
      contents: read
    container:
      # The pinned runtime (docs/baseline/baseline.md, PHP 7.4.27) — the
      # same image as the runtime job. The composer:2.2.24 image runs a
      # newer PHP, so it cannot host this check: config.platform.php
      # pins the platform to 7.4.27, which that image does not satisfy.
      image: php:7.4.27-cli
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify runtime matches the pinned baseline version
        # config.platform.php would mask a drifted image tag, so assert
        # the actual runtime version explicitly.
        run: |
          set -euo pipefail
          actual="$(php -r 'echo PHP_VERSION;')"
          expected="7.4.27"
          if [ "$actual" != "$expected" ]; then
            echo "::error::PHP runtime $actual does not match the pinned baseline version $expected (docs/baseline/baseline.md)"
            exit 1
          fi
          echo "Pinned runtime confirmed: PHP $expected"

      - name: Install platform extensions required by the manifest
        # The manifest requires ext-gd; json/pdo/xml are bundled in the
        # php CLI image. Platform checks stay enforced — no
        # --ignore-platform-reqs anywhere below.
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends libpng-dev
          docker-php-ext-install gd
          php -m | grep -qi '^gd$'

      - name: Install Composer 2.2.24 (SHA-384-verified installer)
        # Same pinned version as the composer-validate job. The official
        # installer is verified against the published installer signature
        # before it may run; --version pins the composer release itself.
        run: |
          set -euo pipefail
          expected="$(curl -fsS https://composer.github.io/installer.sig)"
          curl -fsS https://getcomposer.org/installer -o /tmp/composer-setup.php
          actual="$(php -r 'echo hash_file("sha384", "/tmp/composer-setup.php");')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Composer installer signature mismatch"
            exit 1
          fi
          php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer --version=2.2.24
          composer --version

      - name: Guard — committed lock file must exist and be usable
        # composer install without a lock file silently re-resolves
        # fresh versions — the exact fallback this check forbids — so a
        # missing or unusable lock must fail the job before install runs.
        working-directory: src
        run: |
          set -euo pipefail
          if [ ! -f composer.lock ]; then
            echo "::error::composer.lock is missing in src/ — refusing to install: composer install would re-resolve fresh versions instead of using the committed lock file"
            exit 1
          fi
          # The PHP script is intentionally single-quoted so the shell
          # never expands its $variables — SC2016 is a false positive.
          # shellcheck disable=SC2016
          php -r '
            $lock = json_decode(file_get_contents("composer.lock"), true);
            if (!is_array($lock)) {
                fwrite(STDERR, "::error::composer.lock is not usable: invalid JSON\n");
                exit(1);
            }
            $count = 0;
            foreach (["packages", "packages-dev"] as $key) {
                if (isset($lock[$key]) && is_array($lock[$key])) {
                    $count += count($lock[$key]);
                }
            }
            if ($count === 0) {
                fwrite(STDERR, "::error::composer.lock is not usable: empty package set\n");
                exit(1);
            }
            echo "composer.lock usable: $count locked packages\n";
          '

      - name: Install dependencies exactly as locked
        # Full install (dev deps included, post-install scripts run) —
        # faithful to a developer's `composer install`. Composer reads
        # the lock file and installs exactly those versions; the output
        # assertion proves no re-resolution happened.
        working-directory: src
        run: |
          set -euo pipefail
          composer install --no-interaction --no-progress 2>&1 | tee /tmp/composer-install.log
          if ! grep -q "from lock file" /tmp/composer-install.log; then
            echo "::error::install output does not show lock-file-driven installation — refusing to trust a re-resolved dependency set"
            exit 1
          fi
          echo "Installed versions (composer show --direct):"
          composer show --direct

  php-lint:
    name: PHP syntax lint (src/, excluding vendor)
    runs-on: ubuntu-latest
    # Read-only job: explicit job-level override keeps the effective
    # scope visible on top of the workflow-level baseline.
    permissions:
      contents: read
    container:
      # The pinned runtime (docs/baseline/baseline.md, PHP 7.4.27).
      # Syntax rules are PHP-version-dependent, so the lint must run on
      # the exact pinned version — a drifted image tag would silently
      # change what "valid syntax" means. `php -l` needs no extra
      # extensions, so no apt/gd step is required here.
      image: php:7.4.27-cli
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify runtime matches the pinned baseline version
        # Same explicit assertion as composer-install: guard against a
        # drifted image tag changing what "valid syntax" means.
        run: |
          set -euo pipefail
          actual="$(php -r 'echo PHP_VERSION;')"
          expected="7.4.27"
          if [ "$actual" != "$expected" ]; then
            echo "::error::PHP runtime $actual does not match the pinned baseline version $expected (docs/baseline/baseline.md)"
            exit 1
          fi
          echo "Pinned runtime confirmed: PHP $expected"

      - name: Lint project source for syntax errors
        # Scope: the project's own source (src/), excluding vendored
        # third-party code (src/vendor/). Passing files stay silent;
        # failures are collected and printed with php -l's own file+line
        # message, then the job fails — any syntax error fails the
        # pipeline and the output names the offending file.
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find src -type f -name '*.php' -not -path 'src/vendor/*' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no PHP files found under src/ (excluding src/vendor/) — check the lint scope"
            exit 1
          fi
          failures=0
          for file in "${files[@]}"; do
            if ! output="$(php -l "$file" 2>&1)"; then
              echo "$output"
              failures=$((failures + 1))
            fi
          done
          if [ "$failures" -gt 0 ]; then
            echo "::error::$failures of ${#files[@]} PHP files failed the syntax check"
            exit 1
          fi
          echo "Syntax lint passed: ${#files[@]} PHP files checked, 0 errors."
