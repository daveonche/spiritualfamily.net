# CI pipeline.
#
# Jobs:
# - commit-msg: enforce the commit-msg hook on every pushed/PR commit so
#   client-side bypasses (--no-verify, unwired hooks) cannot land
#   non-conforming subjects. The hook script .githooks/commit-msg is the
#   single source of truth.
# - runtime: verify the pipeline executes on the single pinned runtime
#   version recorded in docs/baseline/baseline.md (PHP 7.4.27).
# - composer-validate: validate the dependency manifest's structure and
#   declared metadata with `composer validate --strict`, independent of
#   installation (nothing is downloaded). Manifest ↔ lock consistency is
#   a separate dedicated check.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only baseline: this workflow never writes to the repository.
permissions:
  contents: read

jobs:
  commit-msg:
    name: Enforce commit-msg hook
    runs-on: ubuntu-latest
    steps:
      # Full history is genuinely required: the push range and the
      # new-branch fallback (--not --remotes) resolve commits a depth-1
      # checkout would not fetch.
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Validate commit subjects with .githooks/commit-msg
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.base_ref || github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            # PR: validate every commit the pull request introduces
            # (the merge commit itself is hook-exempt: "Merge ...")
            git log --format=%s "origin/$BASE_REF..$HEAD_SHA" > /tmp/subjects.txt
          elif [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            # New branch or rewritten history: BEFORE_SHA is all-zero or no
            # longer resolves — validate every commit not on any remote ref
            git log --format=%s "$HEAD_SHA" --not --remotes > /tmp/subjects.txt
          else
            # Push to an existing branch: validate exactly the pushed range
            git log --format=%s "$BEFORE_SHA..$HEAD_SHA" > /tmp/subjects.txt
          fi

          status=0
          while IFS= read -r subject; do
            printf '%s\n' "$subject" > /tmp/commit-msg.txt
            if ! bash .githooks/commit-msg /tmp/commit-msg.txt; then
              echo "::error::commit subject rejected by .githooks/commit-msg: $subject"
              status=1
            fi
          done < /tmp/subjects.txt
          exit "$status"

  runtime:
    name: Pinned runtime verification (PHP 7.4.27)
    runs-on: ubuntu-latest
    container:
      # Single pinned runtime version from docs/baseline/baseline.md
      # (Pinned Versions: PHP runtime 7.4.27). The project's own app image
      # is built locally and not registry-published, so CI uses the official
      # php image tagged at the exact pinned version; the version assertion
      # below guards against tag drift.
      image: php:7.4.27-cli
    steps:
      - name: Verify runtime matches the pinned baseline version
        run: |
          set -euo pipefail
          php -v
          actual="$(php -r 'echo PHP_VERSION;')"
          expected="7.4.27"
          if [ "$actual" != "$expected" ]; then
            echo "::error::PHP runtime $actual does not match the pinned baseline version $expected (docs/baseline/baseline.md)"
            exit 1
          fi
          echo "Pinned runtime confirmed: PHP $expected"

  composer-validate:
    name: Validate dependency manifest (composer.json)
    runs-on: ubuntu-latest
    # Read-only job: explicit job-level override keeps the effective
    # scope visible on top of the workflow-level baseline.
    permissions:
      contents: read
    container:
      # Composer 2.2 LTS line — the composer line compatible with the
      # PHP 7.4 baseline era — at an exact tag. Validation is local
      # only: no dependency download, no install step.
      image: composer:2.2.24
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate composer.json structure and declared metadata
        run: |
          set -euo pipefail
          composer --version
          # --strict: any warning fails the job, so a failed validation
          # marks the whole pipeline failed.
          # Lock-related and publish/version checks are out of scope here:
          # manifest ↔ lock consistency is a separate dedicated check, and
          # this repository is a project, not a published package.
          composer validate --strict --no-check-all --no-check-lock --no-check-publish --no-check-version
          echo "Dependency manifest validation passed."
