; Outgoing-mail relay (Story S1.4 Step 3 duty check): PHP mail() hands the
; message to sendmail_path, and the stock /usr/sbin/sendmail cannot deliver
; from inside the container (mail() fails silently). Route it through the
; msmtp-sendmail wrapper (docker/app/msmtp-sendmail.sh, installed in
; docker/app/Dockerfile) instead: it assembles the msmtp invocation from
; the environment — host/port always (compose.yml app.environment defaults
; target the Docker Desktop MailHog extension, SMTP 1025; production
; overrides via Coolify env, Story S1.6), and authentication/STARTTLS when
; MAIL_SMTP_AUTH=on with MAIL_SMTP_USER/MAIL_SMTP_PASSWORD set (Story S1.6
; Step 5). Elgg supplies the envelope-from itself (-f site email via mail()
; additional_parameters), so no --read-envelope-from here: msmtp rejects
; --from and --read-envelope-from together.
sendmail_path = "/usr/local/bin/msmtp-sendmail -t"
