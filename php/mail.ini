; Outgoing-mail relay (Story S1.4 Step 3 duty check): PHP mail() hands the
; message to sendmail_path, and the stock /usr/sbin/sendmail cannot deliver
; from inside the container (mail() fails silently). Route it through msmtp
; (installed in docker/app/Dockerfile) instead. Host/port come from the
; environment: compose.yml app.environment defaults target the Docker
; Desktop MailHog extension (SMTP 1025); production overrides both via
; Coolify env (Story S1.6). Elgg supplies the envelope-from itself (-f
; site email via mail() additional_parameters), so no --read-envelope-from
; here: msmtp rejects --from and --read-envelope-from together.
sendmail_path = "/usr/bin/msmtp --host=${MAIL_SMTP_HOST} --port=${MAIL_SMTP_PORT} -t"
